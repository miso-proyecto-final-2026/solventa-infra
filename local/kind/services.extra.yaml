# Muestra de "añadir un microservicio" (US3): el backend actual + ms-prueba, que usa una imagen mínima
# (servidor HTTP de Python) y posee el esquema nuevo `identidad`. Antes de aplicar, construir y cargar la imagen:
#   docker build -t ms-prueba:local -f Dockerfile.ms-prueba .
#   kind load docker-image ms-prueba:local --name solventa
# Uso:
#   terraform -chdir=local/kind apply -var services_file=services.extra.yaml
reserved_schemas: [perfilamiento, suscripcion, pagos, siniestros, socios]
drop_schemas: []

services:
  - name: solventa-backend
    image_tag: local
    port: 8000
    health_path: /health
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }
    replicas: { min: 2, max: 4 }
    autoscaling: { cpu_target_percent: 70 }
    owned_schemas: [public, cotizacion]
    database_env_vars: [DATABASE_URL, COTIZACION_DATABASE_URL]
    cache_env_var: REDIS_URL
    settings:
      REGLAS_VERSION: v1
      PROVEEDORES_TIMEOUT_S: "0.7"
    migration_command: [alembic, upgrade, head]

  - name: ms-prueba
    image_tag: local
    port: 8000
    health_path: /
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }
    replicas: { min: 2, max: 4 }
    owned_schemas: [identidad]
    database_env_vars: [DATABASE_URL]
    cache_env_var: ""
    migration_command: null

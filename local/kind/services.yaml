# Misma estructura que environments/staging/services.yaml (contrato C1), con imágenes locales.
reserved_schemas: [identidad, perfilamiento, suscripcion, pagos, siniestros, socios]
drop_schemas: []

services:
  - name: solventa-backend
    image_tag: local # docker build -t solventa-backend:local ../solventa-backend && kind load docker-image ...
    port: 8000
    health_path: /health
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }
    replicas: { min: 2, max: 4 }
    # Misma métrica que staging (HA03); objetivo y subida iguales para probar la cadena app -> Prometheus -> HPA.
    autoscaling:
      cpu_target_percent: 70
      concurrent_requests_target: 3
      scale_up: { pods: 4, percent: 100, period_seconds: 15, stabilization_window_seconds: 0 }
    metrics_path: /metrics
    owned_schemas: [public, cotizacion]
    database_env_vars: [DATABASE_URL, COTIZACION_DATABASE_URL]
    cache_env_var: REDIS_URL
    settings:
      REGLAS_VERSION: v1
      PROVEEDORES_TIMEOUT_S: "0.7"
    migration_command: [alembic, upgrade, head]
    run_as_non_root: false

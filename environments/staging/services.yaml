# Lista única de microservicios (contrato C1). La leen bootstrap, platform y baseline.
# Esquemas reservados para microservicios futuros (sin dueño, sin permisos).
reserved_schemas: [socios]

# Solo se eliminan si están aquí Y no tienen dueño. Vacío por defecto.
drop_schemas: []

# Topics del bus de eventos (MSK, HS2). Contrato de la documentación técnica §4.2: `key` es la clave de partición.
# Cada uno tiene su cola de mensajes fallidos `<topic>.dlq` (dlq: false la omite) y 3 particiones con retención de 7 días
# por defecto. Un servicio solo recibe permisos sobre los topics que declara en `eventos` (produce / consume).
topics:
  - { name: solventa.suscripcion.comandos, key: suscripcion_id }        # MS Suscripción -> MS Pagos: cobro_prima_solicitado
  - { name: solventa.pagos.resultados, key: suscripcion_id }            # MS Pagos -> MS Suscripción: cobro_prima_confirmado / rechazado
  - { name: solventa.suscripcion.revision, key: suscripcion_id }        # MS Suscripción -> consola web: derivada_a_revision / decision_tomada
  - { name: solventa.polizas.ciclovida, key: poliza_id }                # MS Suscripción -> Siniestros, analítica: poliza_emitida / cancelada
  - { name: solventa.siniestros.eventos, key: poliza_id }               # fuente externa -> MS Siniestros: evento_parametrico_recibido
  - { name: solventa.siniestros.comandos, key: evento_id }              # MS Siniestros -> MS Pagos: indemnizacion_solicitada
  - { name: solventa.pagos.indemnizaciones, key: evento_id }            # MS Pagos -> MS Siniestros: indemnizacion_pagada / fallida
  - { name: solventa.identidad.kyc, key: cliente_id }                   # MS Identidad: verificacion_completada / rechazada
  - { name: solventa.identidad.consentimiento, key: cliente_id }        # MS Identidad -> Cotización, Perfilamiento: consentimiento_otorgado / revocado
  - { name: solventa.notificaciones, key: cliente_id }                  # varios -> servicio de notificaciones: notificacion_push / email
  - { name: solventa.humo, key: id, partitions: 1, dlq: false }         # solo para la prueba de humo de HS2 (scripts/prueba-humo-kafka.sh)

services:
  - name: solventa-backend            # = repo ECR, Deployment, Service, rol de BD (solventa_backend)
    image_tag: "0000000"              # tag inicial; sustituir por el SHA publicado antes del baseline
    port: 8000
    health_path: /health
    resources:
      requests: { cpu: 250m, memory: 256Mi }
      limits: { cpu: 1000m, memory: 512Mi }
    replicas: { min: 2, max: 10 }
    autoscaling: { cpu_target_percent: 70 }
    owned_schemas: [public, cotizacion]
    database_env_vars: [DATABASE_URL, COTIZACION_DATABASE_URL]
    cache_env_var: REDIS_URL
    settings:
      REGLAS_VERSION: v1
      PROVEEDORES_TIMEOUT_S: "0.7"
      # Cotización consulta el consentimiento a MS Identidad por REST síncrono (ADR-0002); el Service es ClusterIP en el puerto 80.
      IDENTIDAD_URL: http://solventa-identidad
      IDENTIDAD_TIMEOUT_S: "0.3"
    # Misma clave que Identidad acepta en SERVICE_API_KEYS; nace en Secrets Manager, nunca en git.
    secret_env_vars:
      IDENTIDAD_SERVICE_KEY: solventa/staging/identidad-service-key
      # Token del asesor (HU38, ADR-0008): Identidad lo firma (HS256) y Cotización lo valida; mismo secreto en ambos.
      # Sin él Cotización no arranca fuera de modo desarrollo. Nace aleatorio en Secrets Manager, nunca en git.
      ASESOR_JWT_SECRETO: solventa/staging/asesor-jwt-secreto
      # Clave de auditor (HU14/HU11): habilita GET /v1/cotizaciones/{id}/desglose y /consultas-externas
      # con la cabecera X-Service-Key. Sin ella esos endpoints responden 403 (falla cerrado).
      # Provisional hasta los roles internos (F26). Se lee de Secrets Manager; nunca vive en git.
      AUDITOR_API_KEYS: solventa/staging/auditor-api-key
    migration_command: [alembic, upgrade, head]
    run_as_non_root: false
    deploy_repository: miso-proyecto-final-2026/solventa-backend
    # Borde público: CloudFront + WAF → API Gateway → NLB → este NodePort.
    edge:
      node_port: 30080
      path_prefixes: [/v1/cotizaciones]

  - name: solventa-identidad          # MS Identidad (ADR-0001): clientes, sesión y consentimiento; esquema propio `identidad`
    image_tag: "0000000"              # tag inicial; sustituir por el SHA publicado antes del baseline
    port: 8000
    health_path: /health
    resources:
      requests: { cpu: 250m, memory: 256Mi }
      limits: { cpu: 1000m, memory: 512Mi }
    replicas: { min: 2, max: 6 }
    autoscaling: { cpu_target_percent: 70 }
    owned_schemas: [identidad]
    database_env_vars: [DATABASE_URL]
    cache_env_var: ""                 # Identidad no usa Redis
    secret_env_vars:
      SERVICE_API_KEYS: solventa/staging/identidad-service-key
      ASESOR_JWT_SECRETO: solventa/staging/asesor-jwt-secreto   # el mismo que valida MS Cotización
    migration_command: [alembic, upgrade, head]
    run_as_non_root: false
    deploy_repository: miso-proyecto-final-2026/solventa-backend   # monorepo: un repo, un servicio por carpeta
    edge:
      node_port: 30081
      path_prefixes: [/v1/clientes]

  - name: solventa-perfilamiento      # MS Perfilamiento (HU23): enriquece el perfil de riesgo; esquema propio `perfilamiento`
    image_tag: "0000000"              # tag inicial; sustituir por el SHA publicado antes del baseline
    port: 8000
    health_path: /health
    resources:
      requests: { cpu: 250m, memory: 256Mi }
      limits: { cpu: 1000m, memory: 512Mi }
    replicas: { min: 2, max: 10 }
    autoscaling: { cpu_target_percent: 70 }
    owned_schemas: [perfilamiento]
    database_env_vars: [DATABASE_URL]  # el servicio acepta DATABASE_URL como alternativa a PERFILAMIENTO_DATABASE_URL
    cache_env_var: REDIS_URL
    settings:
      # Consulta el consentimiento a MS Identidad por REST síncrono (ADR-0002); el Service es ClusterIP en el puerto 80.
      IDENTIDAD_URL: http://solventa-identidad
      IDENTIDAD_TIMEOUT_S: "0.3"
    secret_env_vars:
      # Misma clave que Identidad acepta en SERVICE_API_KEYS; nace en Secrets Manager, nunca en git.
      IDENTIDAD_SERVICE_KEY: solventa/staging/identidad-service-key
      # Claves de los servicios que llaman a Perfilamiento (X-Service-Key). Vacía = nadie accede.
      # Una clave sin nombre queda con el origen «servicio» en los intentos bloqueados.
      PERFILAMIENTO_API_KEYS: solventa/staging/perfilamiento-api-key
    migration_command: [alembic, upgrade, head]
    run_as_non_root: false
    deploy_repository: miso-proyecto-final-2026/solventa-backend   # monorepo: un repo, un servicio por carpeta
    # Sin `edge`: es un servicio interno. Devuelve datos financieros del cliente y solo lo consumen otros servicios;
    # no se publica por CloudFront ni por el API Gateway. Para probarlo, port-forward al Service (ver README).

  - name: solventa-suscripcion        # MS Suscripción (HU15): saga de suscripción y decisión automática; esquema propio `suscripcion`
    image_tag: "0000000"              # tag inicial; sustituir por el SHA publicado antes del baseline
    port: 8000
    health_path: /health
    resources:
      requests: { cpu: 250m, memory: 256Mi }
      limits: { cpu: 1000m, memory: 512Mi }
    replicas: { min: 2, max: 6 }
    autoscaling: { cpu_target_percent: 70 }
    owned_schemas: [suscripcion]
    database_env_vars: [DATABASE_URL]  # el servicio acepta DATABASE_URL como alternativa a SUSCRIPCION_DATABASE_URL
    cache_env_var: ""                  # Suscripción no usa Redis
    settings:
      # REST síncrono hacia los vecinos (ADR-0002): los Service son ClusterIP en el puerto 80.
      IDENTIDAD_URL: http://solventa-identidad
      COTIZACION_URL: http://solventa-backend
      PERFILAMIENTO_URL: http://solventa-perfilamiento
      # La firma de MSK (SASL/IAM) necesita la región; Pod Identity no la entrega.
      AWS_REGION: us-east-1
    secret_env_vars:
      # Misma clave que Identidad acepta en SERVICE_API_KEYS: con ella Suscripción pregunta a quién pertenece el token.
      IDENTIDAD_SERVICE_KEY: solventa/staging/identidad-service-key
      # La que Perfilamiento acepta en PERFILAMIENTO_API_KEYS (X-Service-Key).
      PERFILAMIENTO_SERVICE_KEY: solventa/staging/perfilamiento-api-key
    # Publica la decisión (cobro y revisión asistida) y, tras la firma, `poliza_emitida` (HU20) a través de su cola de salida,
    # y consume el resultado del cobro (HU18) en el grupo `solventa-suscripcion.pagos`. El PDF de la póliza va al bucket
    # `polizas_documentos` (POLIZAS_BUCKET lo entrega baseline; el permiso de escritura va en el rol de MSK de este servicio).
    eventos:
      produce: [solventa.suscripcion.comandos, solventa.suscripcion.revision, solventa.polizas.ciclovida]
      consume: [solventa.pagos.resultados]
    migration_command: [alembic, upgrade, head]
    run_as_non_root: false
    deploy_repository: miso-proyecto-final-2026/solventa-backend   # monorepo: un repo, un servicio por carpeta
    # Borde público: CloudFront + WAF → API Gateway → NLB → este NodePort. El cliente (app móvil) lo llama con su token.
    edge:
      node_port: 30082
      path_prefixes: [/v1/suscripciones, /v1/polizas]

  - name: solventa-siniestros         # MS Siniestros (HU27): recibe eventos paramétricos y los publica en Kafka; esquema propio `siniestros`
    image_tag: "0000000"              # tag inicial; sustituir por el SHA publicado antes del baseline
    port: 8000
    health_path: /health
    resources:
      requests: { cpu: 250m, memory: 256Mi }
      limits: { cpu: 1000m, memory: 512Mi }
    # Meta de HA03 (10 -> 5.000 eventos/min en <= 60 s): umbral de CPU más bajo para escalar antes que el resto.
    replicas: { min: 2, max: 10 }
    autoscaling: { cpu_target_percent: 50 }
    owned_schemas: [siniestros]
    database_env_vars: [DATABASE_URL]  # el servicio acepta DATABASE_URL como alternativa a SINIESTROS_DATABASE_URL
    cache_env_var: ""                  # Siniestros no usa Redis
    secret_env_vars:
      # Llave del proveedor de eventos (X-Service-Key). Nace aleatoria en Secrets Manager; sin nombre, el servicio la
      # asocia a la fuente `proveedor-simulado`. Vacía = nadie accede. Provisional hasta los roles internos (F26).
      SINIESTROS_API_KEYS: solventa/staging/siniestros-api-key
    migration_command: [alembic, upgrade, head]
    run_as_non_root: false
    deploy_repository: miso-proyecto-final-2026/solventa-backend   # monorepo: un repo, un servicio por carpeta
    # Publica los eventos que recibe y los consume en el grupo `solventa-siniestros.recepcion` (debe empezar por el nombre
    # del servicio). La plataforma le inyecta KAFKA_BOOTSTRAP_SERVERS y AWS_DEFAULT_REGION.
    eventos:
      produce: [solventa.siniestros.eventos]
      consume: [solventa.siniestros.eventos]
    # Borde público: el proveedor de eventos es externo. `high_volume` lo exime del límite global por IP y del throttling
    # general (ráfagas legítimas, EC-E2.1) y le aplica uno propio y más alto; el resto de rutas conserva los límites bajos.
    edge:
      node_port: 30083
      path_prefixes: [/v1/siniestros]
      high_volume: true

  - name: solventa-pagos              # MS Pagos (HU18): cobro de la prima con pasarela simulada; esquema propio `pagos`
    image_tag: "0000000"              # tag inicial; sustituir por el SHA publicado antes del baseline
    port: 8000
    health_path: /health
    resources:
      requests: { cpu: 250m, memory: 256Mi }
      limits: { cpu: 1000m, memory: 512Mi }
    replicas: { min: 2, max: 6 }
    autoscaling: { cpu_target_percent: 70 }
    owned_schemas: [pagos]
    database_env_vars: [DATABASE_URL]  # el servicio acepta DATABASE_URL como alternativa a PAGOS_DATABASE_URL
    cache_env_var: ""                  # Pagos no usa Redis
    settings:
      # Pasarela simulada (ADR-0014): el modo por defecto aprueba; el prefijo del token elige otro modo por cobro.
      PASARELA_PROVEEDOR: simulador
      PASARELA_SIM_MODO: APROBAR
      # PROVISIONAL: la historia no fija la duración del período de gracia; validar con negocio (la gestión es de HU19).
      PERIODO_GRACIA_DIAS: "3"
      # La firma de MSK (SASL/IAM) necesita la región; Pod Identity no la entrega.
      AWS_REGION: us-east-1
    secret_env_vars:
      # Claves de quien consulta o invoca la API interna (X-Service-Key). Vacía = nadie accede. Nace aleatoria en
      # Secrets Manager, nunca en git; con ella se prueba por túnel (ver README).
      PAGOS_API_KEYS: solventa/staging/pagos-api-key
    # Consume el comando de cobro de la saga en el grupo `solventa-pagos.cobros` y publica el resultado por su cola
    # de salida. La plataforma le inyecta KAFKA_BOOTSTRAP_SERVERS y AWS_DEFAULT_REGION.
    eventos:
      produce: [solventa.pagos.resultados]
      consume: [solventa.suscripcion.comandos]
    migration_command: [alembic, upgrade, head]
    run_as_non_root: false
    deploy_repository: miso-proyecto-final-2026/solventa-backend   # monorepo: un repo, un servicio por carpeta
    # Sin `edge`: es un servicio interno. Maneja tokens de pago y solo lo llaman otros servicios (o una persona por
    # túnel con la clave); no se publica por CloudFront ni por el API Gateway (SAQ-A, EC-S2.1).

